<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StudyFlow AI</title>

  <!-- Single font load — Sora for display, Inter for body -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="intro.css">
  <link rel="stylesheet" href="styles.css">

  <!-- PDF.js with worker configured inline to avoid silent failures -->
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
  </script>

  <script src="https://unpkg.com/mammoth/mammoth.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Force black dark theme as default — overrides any saved "light" if none set -->
  <script>
    if (!localStorage.getItem("theme")) {
      localStorage.setItem("theme", "dark");
    }
    if (localStorage.getItem("theme") === "light") {
      document.documentElement.classList.add("light");
    }
  </script>

  <style>
    /* =============================================
       BLACK DARK THEME OVERRIDE
       Targets both :root and body so it applies
       before styles.css paints anything purple.
    ============================================= */
    :root {
      --bg-primary:   #000000;
      --bg-secondary: #0a0a0a;
      --bg-glass:     rgba(255,255,255,0.04);
      --bg-glass-hover: rgba(255,255,255,0.07);
      --border:       rgba(255,255,255,0.08);
      --text-primary: #f0f0f0;
      --text-muted:   #888;
      --accent:       #ffffff;
      --accent-soft:  rgba(255,255,255,0.12);
    }

    /* Light mode keeps its own colours from styles.css */
    html.light body { background: #f5f5f5; }

    body {
      background: var(--bg-primary) !important;
      color: var(--text-primary);
    }

    /* Kill any purple gradients that may come from styles.css */
    body:not(.light) .sidebar,
    body:not(.light) .glass-panel,
    body:not(.light) .chat-panel,
    body:not(.light) .edit-panel,
    body:not(.light) .tools-grid .tool-btn,
    body:not(.light) .upload-area {
      background: var(--bg-glass) !important;
      border-color: var(--border) !important;
    }

    body:not(.light) .primary-btn {
      background: #fff !important;
      color: #000 !important;
    }

    body:not(.light) .tool-btn:hover {
      background: var(--bg-glass-hover) !important;
      border-color: rgba(255,255,255,0.2) !important;
    }

    /* =============================================
       CACHE BAR STYLES
    ============================================= */
    #cacheBar {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px;
      margin-bottom: 12px;
      border-radius: 10px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      font-size: 0.85rem;
      color: var(--text-muted, #888);
    }

    html.light #cacheBar {
      background: rgba(0,0,0,0.04);
      border-color: rgba(0,0,0,0.1);
    }

    #cacheBar #cacheLabel {
      flex: 1;
    }

    #cacheBar #regenBtn {
      padding: 5px 12px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.15);
      background: transparent;
      color: inherit;
      cursor: pointer;
      font-size: 0.82rem;
      white-space: nowrap;
      transition: background 0.2s;
    }

    #cacheBar #regenBtn:hover {
      background: rgba(255,255,255,0.08);
    }

    html.light #cacheBar #regenBtn {
      border-color: rgba(0,0,0,0.15);
    }

    html.light #cacheBar #regenBtn:hover {
      background: rgba(0,0,0,0.06);
    }

    /* =============================================
       DROP ZONE — pointer cursor so whole area is
       clearly clickable (label inside handles it)
    ============================================= */
    .upload-area { cursor: pointer; }
  </style>
</head>

<body>

  <!-- INTRO SPLASH -->
  <div id="introSplash">
    <div class="intro-grid"></div>
    <div class="intro-glow-1"></div>
    <div class="intro-glow-2"></div>
    <canvas id="introCanvas"></canvas>
    <div class="intro-content">
      <div class="intro-icon-ring"></div>
      <div class="intro-icon">📚</div>
      <h1 class="intro-title">StudyFlow AI</h1>
      <p class="intro-tagline"></p><span class="intro-cursor"></span>
      <p class="intro-credit"></p>
      <div class="intro-bar-wrap"><div class="intro-bar-fill"></div></div>
    </div>
  </div>

  <div class="background-blur"></div>

  <div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

      <h1 class="logo">📚 StudyFlow AI</h1>

      <button id="newSubjectBtn" class="primary-btn">+ Add Subject</button>

      <input type="text" id="searchInput" placeholder="Search subjects...">

      <div id="subjectList"></div>

      <div class="sidebar-bottom">
        <!--
          #userBadgeWrap is injected here by addUserBadge() in script.js
          (inserted as sidebar-bottom's firstChild after login).
          The buttons below are legacy fallbacks / extras.
        -->
        <button id="themeToggle">🌙 Dark Mode</button>
        <button id="musicToggle">🎵 Music</button>
        <!--
          #resetKeyBtn: script.js wires this up for legacy API-key reset.
          The user-badge dropdown also handles key updates post-login,
          but this button stays so the querySelector doesn't return null.
        -->
        <button id="resetKeyBtn">🔑 Reset API Key</button>
      </div>

    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">

      <!-- TOP BAR -->
      <div class="top-bar">
        <div>
          <h2 id="subjectTitle">Select a Subject</h2>
          <p id="subjectSubtitle">Upload study guides to begin.</p>
        </div>
        <div class="stats-container">
          <!--
            #streak: referenced by script.js but never written to (yet).
            Kept here so the element exists and future updates work without HTML changes.
          -->
          <div class="stat-card">🔥 <span id="streak">0</span></div>
          <div class="stat-card">⭐ <span id="xp">0</span> XP</div>
          <div class="stat-card">🏆 Lv.<span id="level">1</span></div>
        </div>
      </div>

      <!-- UPLOAD
           The entire dropZone div listens for dragover/dragleave/drop via script.js.
           The hidden <input> is triggered by the <label for="fileInput"> inside,
           AND by clicking the dropZone div itself (onclick below) so the full
           zone is clickable — not just the "Browse Files" label text.
      -->
      <div class="upload-area" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <h3>Drop Files Here</h3>
        <p>PDF, DOCX, TXT</p>
        <!--
          stopPropagation on the label prevents the div onclick from firing
          a second time when the label itself is clicked (label already
          opens the picker natively via for="fileInput").
        -->
        <label class="upload-label" for="fileInput" onclick="event.stopPropagation()">Browse Files</label>
        <input type="file" id="fileInput" multiple accept=".pdf,.docx,.txt,text/plain,application/pdf" style="display:none">
      </div>

      <!-- FILES -->
      <div class="glass-panel">
        <h3>Uploaded Files</h3>
        <ul id="fileList"></ul>
      </div>

      <!-- TOOLS -->
      <div class="tools-grid">
        <button class="tool-btn" id="summarizeBtn">🧠 Summarize Notes</button>
        <button class="tool-btn" id="flashcardBtn">🃏 Generate Flashcards</button>
        <button class="tool-btn" id="quizBtn">❓ Generate Quiz</button>
        <button class="tool-btn" id="studyPlanBtn">📅 Study Plan</button>
        <button class="tool-btn" id="eli5Btn">🧒 Explain Like I'm 5</button>
        <button class="tool-btn" id="mnemonicBtn">🧩 Memory Tricks</button>
        <button class="tool-btn" id="weaknessBtn">📉 Weakness Detector</button>
      </div>

      <!-- CACHE BAR
           hideCacheBar() sets display:none.
           showResultWithBar() creates #inlineCacheBar inside #output instead,
           so this element is the legacy/fallback bar referenced by hideCacheBar().
      -->
      <div id="cacheBar">
        <span id="cacheLabel">📌 Showing saved result</span>
        <button id="regenBtn">🔄 Regenerate</button>
      </div>

      <!-- OUTPUT
           script.js writes into #output directly via setOutput().
           showResultWithBar() also prepends #inlineCacheBar as a child here.
      -->
      <div class="glass-panel">
        <h3>AI Output</h3>
        <div id="output"></div>
      </div>

      <!-- EDIT PANEL
           Shown by showEditPanel(), hidden by hideEditPanel().
           script.js wires #editSendBtn, #editInput (keydown Enter), #editCloseBtn.
           #editPanelTitle text is set dynamically based on flashcard vs quiz mode.
           #editMessages receives chat bubbles.
      -->
      <div class="edit-panel" id="editPanel" style="display:none;">
        <div class="edit-panel-header">
          <h3 id="editPanelTitle">✏️ Edit with AI</h3>
          <button class="edit-close-btn" id="editCloseBtn">✕</button>
        </div>
        <div id="editMessages"></div>
        <div class="edit-row">
          <input type="text" id="editInput" placeholder="Ask AI to edit...">
          <button id="editSendBtn">Ask AI</button>
        </div>
      </div>

      <!-- CHAT
           #chatMessages: messages appended by addMessage().
           #chatInput: Enter key wired to sendMessage() in script.js.
           #sendBtn: onclick wired to sendMessage() in script.js.
      -->
      <div class="chat-panel">
        <h3>Study Assistant</h3>
        <div id="chatMessages"></div>
        <div class="chat-row">
          <input type="text" id="chatInput" placeholder="Ask anything about this subject...">
          <button id="sendBtn">Send</button>
        </div>
      </div>

      <!-- POMODORO
           #timer: text updated by updateTimerDisplay().
           #startTimer / #pauseTimer / #resetTimer: wired in script.js.
      -->
      <div class="glass-panel">
        <h3>Pomodoro Timer</h3>
        <div id="timer">25:00</div>
        <div class="timer-controls">
          <button id="startTimer">▶ Start</button>
          <button id="pauseTimer">⏸ Pause</button>
          <button id="resetTimer">↺ Reset</button>
        </div>
      </div>

    </main>
  </div>

  <!--
    #studyMusic: script.js calls music.pause() / music.play() via
    document.getElementById("studyMusic"). The loop attribute keeps
    lo-fi going indefinitely. Hosted on Pixabay (royalty-free).
  -->
  <audio id="studyMusic" loop src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3?filename=lofi-study-112191.mp3"></audio>

  <script src="intro.js"></script>
  <script src="script.js"></script>

  <!--
    Theme toggle patch: script.js sets themeToggle.onclick using body.classList,
    but we need html.classList toggled too for the early-paint CSS vars above.
    This runs AFTER script.js and overwrites the handler, keeping both in sync.
    Also corrects the button label to match the stored theme on first load.
  -->
  <script>
    (function patchThemeToggle() {
      const btn = document.getElementById("themeToggle");
      if (!btn) return;

      btn.onclick = () => {
        document.body.classList.toggle("light");
        document.documentElement.classList.toggle("light");
        const isLight = document.body.classList.contains("light");
        btn.textContent = isLight ? "🌞 Light Mode" : "🌙 Dark Mode";
        localStorage.setItem("theme", isLight ? "light" : "dark");
      };

      // Sync label to current theme on load
      const saved = localStorage.getItem("theme");
      btn.textContent = saved === "light" ? "🌞 Light Mode" : "🌙 Dark Mode";

      // Apply light class to body too if html already has it (set by early script above)
      if (document.documentElement.classList.contains("light")) {
        document.body.classList.add("light");
      }
    })();
  </script>

</body>
</html>
