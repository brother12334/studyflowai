<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StudyFlow AI</title>

  <link rel="stylesheet" href="styles.css">

  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script src="https://unpkg.com/mammoth/mammoth.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body>

<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar">
    <h1>📚 StudyFlow</h1>

    <button id="newSubjectBtn">+ Add Subject</button>

    <input type="text" id="searchInput" placeholder="Search subjects..." />

    <div id="subjectList"></div>

    <div class="bottom-controls">
      <button id="themeToggle">🌙 Dark Mode</button>
      <button id="musicToggle">🎵 Music</button>
    </div>
  </aside>

  <!-- Main -->
  <main class="main-content">

    <section class="dashboard">

      <div class="top-bar">
        <h2 id="subjectTitle">Select a Subject</h2>

        <div class="stats">
          <div>🔥 Streak: <span id="streak">0</span></div>
          <div>⭐ XP: <span id="xp">0</span></div>
          <div>🏆 Level: <span id="level">1</span></div>
        </div>
      </div>

      <!-- Upload -->
      <div class="upload-area" id="dropZone">
        <p>Drag & Drop Study Guides Here</p>
        <input type="file" id="fileInput" multiple />
      </div>

      <!-- Uploaded Files -->
      <div class="files-section">
        <h3>Uploaded Study Guides</h3>
        <ul id="fileList"></ul>
      </div>

      <!-- AI Tools -->
      <div class="tools-grid">

        <button class="tool-btn" id="summarizeBtn">
          Summarize Notes
        </button>

        <button class="tool-btn" id="flashcardBtn">
          Generate Flashcards
        </button>

        <button class="tool-btn" id="quizBtn">
          Create Quiz
        </button>

        <button class="tool-btn" id="studyPlanBtn">
          Generate Study Plan
        </button>

        <button class="tool-btn" id="eli5Btn">
          Explain Like I'm 5
        </button>

        <button class="tool-btn" id="mnemonicBtn">
          Memory Tricks
        </button>

      </div>

      <!-- Pomodoro -->
      <div class="pomodoro">
        <h3>Pomodoro Timer</h3>
        <div id="timer">25:00</div>
        <button id="startTimer">Start</button>
      </div>

      <!-- AI Chat -->
      <div class="chat-panel">
        <h3>Study Assistant</h3>

        <div id="chatMessages"></div>

        <div class="chat-input-row">
          <input type="text" id="chatInput"
            placeholder="Ask anything about this subject..." />

          <button id="sendBtn">Send</button>
        </div>
      </div>

    </section>

  </main>

</div>

<script src="script.js"></script>
</body>
</html>
